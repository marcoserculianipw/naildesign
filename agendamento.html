<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento | Naildesign</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <nav class="navbar navbar-expand-lg navbar-light bg-white w-100 px-3 px-lg-5 py-3">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html"><img src="./images/logo.jpg" alt="Naildesign Studio" class="brand-logo"></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNaildesign" aria-controls="menuNaildesign" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuNaildesign">
          <div class="navbar-nav ms-auto gap-lg-3">
            <a class="nav-link nav-link-custom" href="index.html">Início</a>
            <a class="nav-link nav-link-custom" href="quemsomos.html">Quem Somos</a>
            <a class="nav-link nav-link-custom" href="comocuidar.html">Como Cuidar</a>
            <a class="btn btn-primary rounded-pill px-3 ms-lg-2" href="agendamento.html">Agendar Horário</a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-5">
    <div class="section-header">
      <h2>Reserve seu Horário</h2>
      <p>Preencha os dados e entraremos em contato para confirmar a disponibilidade.</p>
    </div>

    <section class="booking-container">
      <form id="formAgendamento" class="row g-3">
        <div class="col-12">
          <label for="nome" class="form-label">Nome Completo</label>
          <input type="text" class="form-control" id="nome" name="nome" placeholder="Ex: Carolina Almeida" required>
        </div>

        <div class="col-12">
          <label for="telefone" class="form-label">WhatsApp</label>
          <input type="tel" class="form-control" id="telefone" name="telefone" placeholder="(11) 98765-4321" required>
        </div>

        <div class="col-12">
          <label for="servico" class="form-label">Procedimento</label>
          <select class="form-select" id="servico" name="servico" required>
            <option value="" disabled selected>Escolha um serviço</option>
            <option value="Alongamento em Gel">Alongamento em Gel (Aplicação Inicial)</option>
            <option value="Manutenção em Gel">Manutenção em Gel</option>
            <option value="Blindagem">Blindagem de Unhas Naturais</option>
            <option value="Esmaltação em Gel">Esmaltação em Gel</option>
            <option value="Remoção Segura">Remoção Profissional de Alongamento</option>
          </select>
        </div>

        <div class="col-md-6">
          <label for="data" class="form-label">Data Desejada</label>
          <input type="date" class="form-control" id="data" name="data" required>
        </div>
        <div class="col-md-6">
          <label for="horario" class="form-label">Horário Preferido</label>
          <input type="time" class="form-control" id="horario" name="horario" required>
        </div>

        <div class="col-12">
          <label for="observacoes" class="form-label">Observações (Opcional)</label>
          <textarea class="form-control" id="observacoes" name="observacoes" rows="3" placeholder="Possui alergias ou unhas roídas? Tem algum alongamento anterior para remoção?"></textarea>
        </div>

        <div class="col-12">
          <button type="submit" class="btn btn-primary w-100">Enviar Solicitação</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="text-center text-muted py-4">
    <p class="mb-0">&copy; 2026 Naildesign Studio. Todos os direitos reservados.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
