<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Naildesign | Estúdio de Beleza e Cuidado{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <header class="header">
    <nav class="navbar navbar-expand-lg navbar-light bg-white w-100 px-3 px-lg-5 py-3 shadow-sm">
      <div class="container-fluid">
        <a class="navbar-brand" href="{{ url_for('index') }}">
          <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="Naildesign Studio" class="brand-logo">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNaildesign" aria-controls="menuNaildesign" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuNaildesign">
          <div class="navbar-nav ms-auto gap-lg-3">
            <a class="nav-link nav-link-custom" href="{{ url_for('index') }}">Início</a>
            <a class="nav-link nav-link-custom" href="{{ url_for('quemsomos') }}">Quem Somos</a>
            <a class="nav-link nav-link-custom" href="{{ url_for('comocuidar') }}">Como Cuidar</a>
            <a class="btn btn-primary rounded-pill px-3 ms-lg-2" href="{{ url_for('agendamento') }}">Agendar Horário</a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-5">
    {% block content %}{% endblock %}
  </main>

  <footer class="text-center text-muted py-4 border-top mt-5 bg-white">
    <div class="container">
      <p class="mb-1">&copy; 2026 Naildesign Studio. Todos os direitos reservados.</p>
      <p class="mb-0 fw-semibold text-secondary">Marcos Vinicius Erculiani Chaves &bull; Atividade 3 &bull; DSM</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
